[workspace]
members = [
  "crates/lib-core",
  "crates/lib-ipify",
  "crates/lib-hostinger",
  "crates/app-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
lib-core = { path = "crates/lib-core" }
lib-ipify = { path = "crates/lib-ipify" }
lib-hostinger = { path = "crates/lib-hostinger" }
ureq = "3.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
clap = { version = "4.6.7", features = ["derive"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
